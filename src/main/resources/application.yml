server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ecommerce-demo-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400

logging:
  level:
    com.ecommerce: DEBUG

grpc:
  server:
    port: 19090   # 9090 被本机 0dcloud.app 占用，使用 19090
    reflection:
      enabled: true

ecommerce:
  # 测试免密登录后门：默认关闭。仅在 dev/test profile 且显式置 true 时启用。
  # 严禁在 prod 启用——TestLoginBackdoorController 启动时会校验并阻止。
  test-backdoor:
    enabled: false
